name: Release WebUI

# 只由 git tag 驱动：推送形如 v0.6.0 的 tag 才构建并发布 Release。
# 版本号取自 tag 名，不读 package.json；也可在 Actions 页手动指定 tag 补发。

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，如 v0.6.0"
        required: true
        type: string
      force:
        description: "忽略已存在的 Release，强制重新发布"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-webui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check tag format
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "tag 需形如 v0.6.0，当前为 '$TAG'";
            exit 1;
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Decide whether to publish
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG 已发布，跳过（勾选 force 可强制重发）"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install & build
        if: steps.decide.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack dist (archive root = index.html)
        if: steps.decide.outputs.publish == 'true'
        run: |
          test -f dist/index.html || { echo "dist/index.html 不存在，构建失败"; exit 1; }
          (cd dist && zip -rq ../webui-dist.zip .)

      - name: Publish release
        if: steps.decide.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "WebUI ${{ env.TAG }}"
          body: "自动构建的前端发布：${{ github.sha }}"
          files: webui-dist.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          # 强制重发已存在的 Release 时需要覆盖
          overwrite_files: true
