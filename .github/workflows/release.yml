name: Release WebUI

# 改动 package.json 版本号推到 main 时：自动构建前端并发布 GitHub Release。
# 若该版本的 tag（v<version>）已存在则跳过，便于安全地反复推 main。
# 也可在 Actions 页手动 workflow_dispatch 强制发版。

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      force:
        description: "忽略已存在的 Release，强制重新发布"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-webui
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already released
        if: steps.exists.outputs.found == 'true' && github.event.inputs.force != 'true'
        run: echo "v${{ steps.pkg.outputs.version }} 已发布，跳过（如需重发用 force）"

      - name: Install & build
        if: steps.exists.outputs.found == 'false' || github.event.inputs.force == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack dist (archive root = index.html)
        if: steps.exists.outputs.found == 'false' || github.event.inputs.force == 'true'
        run: |
          test -f dist/index.html || { echo "dist/index.html 不存在，构建失败"; exit 1; }
          (cd dist && zip -rq ../webui-dist.zip .)

      - name: Publish release
        if: steps.exists.outputs.found == 'false' || github.event.inputs.force == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "WebUI v${{ steps.pkg.outputs.version }}"
          body: "自动构建的前端发布：${{ github.sha }}"
          files: webui-dist.zip
          draft: false
          prerelease: false
          # 强制重发已存在的 Release 时需要覆盖
          overwrite_files: true
